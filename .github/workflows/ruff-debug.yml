name: Ruff debug

on:
  push:
    branches: ["review/ruff-debug-20260914"]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.5
      - name: Print regression lint and format diff
        run: |
          ruff check --diff tests/test_reply_worker_negotiation_regression.py
          ruff format --diff tests/test_reply_worker_negotiation_regression.py
