name: Ruff debug

on:
  push:
    branches: ["review/ruff-debug-20260914"]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.5
      - name: Print format diff
        run: |
          ruff format --diff \
            src/hh_applicant_tool/automation/reply_worker.py \
            scripts/reply_iterative_ai.py \
            tests/test_reply_worker.py
